name: bot

# Gira su GitHub Actions: ogni run tiene vivo bot.py per ~5h40m, poi salva
# seen.json nel repo. Il cron ogni 15 min tiene sempre un run in coda, che parte
# appena finisce quello attivo (concurrency), quindi il buco è di 1-2 minuti.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # punta del branch, così prende l'ultimo seen.json
      - run: pip install pillow
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - run: timeout 340m python3 bot.py || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: salva seen.json e settings.json
        if: always()
        run: |
          git config user.name "newsroom-bot"
          git config user.email "newsroom-bot@users.noreply.github.com"
          git add -A && git commit -qm "stato del bot" && git pull -q --rebase && git push || true
